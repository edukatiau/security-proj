name: semgrep-scan

on:
  push:
    branches: [ main, edu ]
  pull_request:
    branches: [ main, edu ]
  workflow_dispatch: {}

jobs:
  semgrep:
    name: Semgrep vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install semgrep
        run: python -m pip install --upgrade pip && pip install semgrep

      - name: Run semgrep with local rules (respect .gitignore)
        run: semgrep --config .github/semgrep/rules.yml --json --output semgrep-report.json . || true

      - name: Run semgrep with local rules (include git-ignored, captura .env etc.)
        run: semgrep --config .github/semgrep/rules.yml --json --output semgrep-report-all.json . --no-git-ignore || true

      - name: Fail if any semgrep report found issues
        run: |
          python - <<'PY'
          import json, sys, os
          reports = ["semgrep-report.json", "semgrep-report-all.json"]
          total_results = 0
          total_errors = 0
          missing = []
          for path in reports:
            if not os.path.exists(path):
              missing.append(path)
              continue
            try:
              r = json.load(open(path))
              total_results += len(r.get("results") or [])
              total_errors += len(r.get("errors") or [])
            except Exception as e:
              print("Failed to parse", path, e)
              sys.exit(2)
          if missing:
            print("Missing reports (will continue):", missing)
          if total_errors:
            print("Semgrep reported errors across reports")
            sys.exit(2)
          if total_results > 0:
            print(f"Semgrep found {total_results} total issues across reports")
            sys.exit(1)
          print("No semgrep findings across reports")
          PY

      - name: Upload semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-report.json
            semgrep-report-all.json
