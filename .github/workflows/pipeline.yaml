name: semgrep-scan

on:
  push:
    branches: [ main, edu ]
  pull_request:
    branches: [ main, edu ]
  workflow_dispatch: {}

jobs:
  semgrep:
    name: Semgrep vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install semgrep
        run: python -m pip install --upgrade pip && pip install semgrep

      - name: Run semgrep with local rules
        run: semgrep --config .github/semgrep/rules.yml --json --output semgrep-report.json . || true

      - name: Fail if semgrep found issues
        run: |
          python - <<'PY'
          import json, sys, os
          path = "semgrep-report.json"
          if not os.path.exists(path):
            print("Semgrep report not found; assuming error")
            sys.exit(2)
          try:
            r = json.load(open(path))
            results = r.get("results") or []
            errors = r.get("errors") or []
            if errors:
              print("Semgrep reported errors:", errors)
              sys.exit(2)
            if len(results) > 0:
              print(f"Semgrep found {len(results)} issues")
              first = results[0]
              print("Example:", first.get("check_id"), first.get("path"), first.get("start"))
              sys.exit(1)
            print("No semgrep findings")
          except Exception as e:
            print("Failed to parse semgrep output:", e)
            sys.exit(2)
          PY

      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
